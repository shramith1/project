<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Number</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated Background Canvas Elements -->
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="game-card">
    <div class="header">
      <span class="status-badge" id="statusBadge">READY</span>
      <h1>GUESS NUMBER</h1>
      <p class="desc">Decrypt the hidden number [1 - 100]</p>
    </div>

    <!-- Active Range Eliminator Visualizer -->
    <div class="range-visualizer">
      <div class="range-labels">
        <span id="minRangeLabel">1</span>
        <span id="rangeStatus">Target inside range</span>
        <span id="maxRangeLabel">100</span>
      </div>
      <div class="track">
        <div id="activeRangeBar" class="active-bar"></div>
      </div>
    </div>

    <!-- Active Feedback Screen (Hidden until first guess) -->
    <div id="displayScreen" class="screen neutral hidden">
      <div id="screenIcon" class="icon">🔒</div>
      <div id="screenMessage" class="message"></div>
    </div>

    <!-- Input Form -->
    <form id="guessForm" class="control-form">
      <div class="input-wrapper">
        <input 
          type="number" 
          id="guessInput" 
          min="1" 
          max="100" 
          placeholder="00" 
          required 
          autocomplete="off"
        />
        <button type="submit" id="submitBtn">GUESS</button>
      </div>
    </form>

    <!-- Power-Ups / Hints Section -->
    <div class="hints-container">
      <button type="button" id="hintEvenOdd" class="hint-btn">
        <span>⚡ Hint: Parity</span>
        <span class="cost">(1 Core)</span>
      </button>
      <button type="button" id="hintPrime" class="hint-btn">
        <span>⚡ Hint: Prime</span>
        <span class="cost">(1 Core)</span>
      </button>
    </div>

    <!-- Metrics Bar -->
    <div class="metrics-grid">
      <div class="metric-box">
        <span class="label">ATTEMPTS</span>
        <span id="attemptsVal" class="value">0</span>
      </div>
      <div class="metric-box">
        <span class="label">ENERGY CORES</span>
        <span id="coresVal" class="value">⚡⚡⚡</span>
      </div>
      <div class="metric-box">
        <span class="label">BEST SCORE</span>
        <span id="bestVal" class="value">-</span>
      </div>
    </div>

    <!-- Live Feed Logs -->
    <div id="logSection" class="log-section hidden">
      <h3>GUESS LOGS</h3>
      <div id="logList" class="log-list"></div>
    </div>

    <button id="restartBtn" class="restart-btn hidden">PLAY AGAIN 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
